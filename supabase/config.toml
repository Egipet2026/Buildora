# Minimal Supabase project config.
#
# Present so the GitHub integration can find and run the migrations in
# supabase/migrations/ without anyone having to run the CLI locally. The
# project_id is a local label only — it does not have to match the id of the
# hosted project it deploys to.

project_id = "buildora"

[db]
# Matches the Postgres major version Supabase provisions for new projects.
major_version = 17
